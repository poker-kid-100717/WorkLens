version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule: { interval: "weekly" }
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/cloudflare"
    schedule: { interval: "weekly" }
  - package-ecosystem: "nuget"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      dotnet:
        patterns: ["*"]
