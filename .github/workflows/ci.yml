name: CI

# Build and validate every piece of the WorkLens project on every push/PR:
# - .NET API/Core/Infrastructure solution (build, format check, EF migration
#   sanity check against a real SQL Server service container)
# - Angular frontend (build, unit tests headless)
# - Browser extension (manifest + JS syntax validation)
# - docker-compose.yml (config validation)
# - Portfolio site (basic HTML validation)
#
# - Public demo hosting (Wrangler deploy dry-run of the Cloudflare Worker + Container)
#
# Personal use stays self-hosted/on-prem. The only thing deployed anywhere is the
# read-only public demo, by deploy-cloudflare.yml (see README, "Public demo").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24.x'

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Ci_Build_Passw0rd!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore WorkLens.slnx

      - name: Build (Release)
        run: dotnet build WorkLens.slnx --configuration Release --no-restore

      - name: Verify code formatting
        run: dotnet format WorkLens.slnx --verify-no-changes --severity error

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Apply EF Core migrations against a real SQL Server instance
        # Exercises every migration end-to-end (schema creation, indexes, FKs) against
        # the same engine used in production, not just "does it compile".
        env:
          ConnectionStrings__WorkLensDb: 'Server=localhost,1433;Database=WorkLensDb_CI;User Id=sa;Password=Ci_Build_Passw0rd!;TrustServerCertificate=True;'
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update \
            --project src/WorkLens.Infrastructure/WorkLens.Infrastructure.csproj \
            --startup-project src/WorkLens.Api/WorkLens.Api.csproj

      - name: Publish API (smoke check)
        run: dotnet publish src/WorkLens.Api/WorkLens.Api.csproj --configuration Release --output /tmp/api-publish --no-restore

      - name: Public demo on SQL Server (as hosted on Cloudflare with DATABASE_URL)
        # Starts the demo twice against the same database: the second start must reset and
        # reseed the fictional tracker data rather than duplicate it.
        env:
          Demo__Enabled: 'true'
          Demo__ConnectionString: 'Server=localhost,1433;Database=WorkLensDemo_CI;User Id=sa;Password=Ci_Build_Passw0rd!;TrustServerCertificate=True;'
          ASPNETCORE_URLS: 'http://127.0.0.1:8080'
        run: |
          for run in 1 2; do
            dotnet /tmp/api-publish/WorkLens.Api.dll > "/tmp/demo-$run.log" 2>&1 &
            pid=$!
            for attempt in $(seq 1 30); do
              curl --fail --silent http://127.0.0.1:8080/api/health | grep -q '"database":true' && break
              sleep 2
            done
            count="$(curl --fail --silent http://127.0.0.1:8080/api/applications | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')"
            kill "$pid"; wait "$pid" || true
            echo "Run $run: $count demo applications"
            if [ "$count" != "10" ]; then cat "/tmp/demo-$run.log"; exit 1; fi
          done

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npx ng build --configuration production

      - name: Unit tests (Vitest)
        run: npx ng test --watch=false

      - name: Dependency audit
        # Fails the build on any high or critical advisory in the dependency tree.
        run: npm audit --audit-level=high

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate manifest.json is well-formed
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); console.log('manifest.json OK')"

      - name: Check every JS file referenced by the manifest exists
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const referenced = new Set();
            if (manifest.background?.service_worker) referenced.add(manifest.background.service_worker);
            for (const cs of manifest.content_scripts ?? []) for (const f of cs.js ?? []) referenced.add(f);
            let missing = false;
            for (const file of referenced) {
              if (!fs.existsSync(file)) {
                console.error('Missing file referenced by manifest.json:', file);
                missing = true;
              }
            }
            if (missing) process.exit(1);
            console.log('All manifest-referenced files exist:', [...referenced].join(', '));
          "

      - name: Syntax-check every JS file
        run: |
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done

  docker-compose:
    name: docker-compose validation
    runs-on: ubuntu-latest
    env:
      SQL_SA_PASSWORD: 'Ci_Build_Passw0rd!'

    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build backend image
        run: docker compose build api

      - name: Build frontend image
        run: docker compose build frontend

  cloudflare-demo:
    name: Public demo hosting (dry-run)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Wrangler deploy dry-run
        run: bash scripts/cloudflare-deploy.sh
        env:
          VALIDATE_ONLY: 'true'
          DATABASE_URL: 'Server=tcp:dry-run.database.windows.net,1433;Database=WorkLens;User ID=dry-run;Password=dry-run;Encrypt=True'

  portfolio-site:
    name: Portfolio site (static HTML)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-site

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate HTML
        run: npx --yes html-validate index.html

      - name: Check for broken relative asset links
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const refs = [...html.matchAll(/(?:href|src)=\"([^\"]+)\"/g)]
              .map(m => m[1])
              .filter(u => !u.startsWith('http') && !u.startsWith('mailto:') && !u.startsWith('tel:') && !u.startsWith('#'));
            let missing = false;
            for (const ref of refs) {
              if (!fs.existsSync(ref)) {
                console.error('Broken local reference:', ref);
                missing = true;
              }
            }
            if (missing) process.exit(1);
            console.log('All local asset references resolve:', refs.join(', '));
          "
