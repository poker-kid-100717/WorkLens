<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WorkLens</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #0b0f14;
    color: #e6ecf2;
    font-size: 13px;
  }
  .header {
    padding: 12px 16px;
    border-bottom: 1px solid #263140;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 { font-size: 14px; font-weight: 600; }
  .header a { color: #8ea0b3; text-decoration: none; font-size: 12px; }
  .body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .field label {
    display: block;
    font-size: 11px;
    color: #8ea0b3;
    margin-bottom: 4px;
  }
  input, textarea {
    width: 100%;
    padding: 8px 10px;
    background: #182029;
    border: 1px solid #263140;
    border-radius: 6px;
    color: #e6ecf2;
    font: inherit;
  }
  textarea { resize: vertical; min-height: 50px; }
  .btn {
    display: block;
    width: 100%;
    padding: 9px;
    border-radius: 6px;
    border: none;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: #3ecf8e; color: #06140e; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 12px; padding: 8px 0; }
  .status-error { color: #e3556b; }
  .status-success { color: #3ecf8e; }
  .not-supported { padding: 24px 16px; text-align: center; color: #8ea0b3; }
</style>
</head>
<body>
  <div class="header">
    <h1>WorkLens</h1>
    <a href="options.html" target="_blank" id="settings-link">Settings</a>
  </div>

  <div id="unsupported" class="not-supported" style="display:none;">
    Open a LinkedIn or Indeed job posting to save it here.
  </div>

  <div id="form" class="body" style="display:none;">
    <div class="field">
      <label>Title</label>
      <input type="text" id="title" />
    </div>
    <div class="field">
      <label>Company</label>
      <input type="text" id="company" />
    </div>
    <div class="field">
      <label>Location</label>
      <input type="text" id="location" />
    </div>
    <div class="field">
      <label>URL</label>
      <input type="text" id="url" />
    </div>
    <div class="field">
      <label>Notes (optional)</label>
      <textarea id="notes"></textarea>
    </div>
    <button class="btn btn-primary" id="save-btn">Save to tracker</button>
    <div id="status" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
