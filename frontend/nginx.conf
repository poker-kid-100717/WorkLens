# Serves the built Angular app and proxies /api/* to the backend container on the
# same Docker network — the frontend calls a relative "/api" path (see api-config.ts),
# so no CORS is involved when running via docker-compose.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the PDF.js module worker explicitly as JavaScript and never fall back to
    # index.html. That fallback is what causes browsers to reject it as text/html.
    location = /assets/pdfjs/pdf.worker.min.mjs {
        types { application/javascript mjs; }
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Angular client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Cache immutable hashed build assets aggressively; never cache index.html itself.
    location ~* \.(?:js|mjs|css|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
