networks:
  worklens-net:
    driver: bridge

volumes:
  sqlserver-data:

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: worklens-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in your .env file}"
      MSSQL_PID: "Express"
    ports:
      # Exposed on the host for ad-hoc access (SSMS/Azure Data Studio) — remove this
      # mapping if you don't want SQL Server reachable outside the Docker network.
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - worklens-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/WorkLens.Api/Dockerfile
    container_name: worklens-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__WorkLensDb: "Server=sqlserver,1433;Database=WorkLensDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      Cors__AllowedOrigins__0: "http://localhost:8080"
      JobFeeds__RefreshIntervalSeconds: "${FEED_REFRESH_INTERVAL_SECONDS:-120}"
      # Comma-free JSON array via individual keys; add more BoardTokens__N lines for
      # additional Greenhouse companies (find the token in a company's career page URL:
      # boards.greenhouse.io/{board_token}).
      JobFeeds__Greenhouse__BoardTokens__0: "${GREENHOUSE_BOARD_TOKEN_0:-}"
      JobFeeds__OpenAi__ApiKey: "${OPENAI_API_KEY:-}"
      JobFeeds__OpenAi__Model: "${OPENAI_MODEL:-gpt-4o-mini}"
      Swagger__Enabled: "${SWAGGER_ENABLED:-true}"
    ports:
      - "5080:8080"
    networks:
      - worklens-net

  frontend:
    build:
      context: ./frontend
    container_name: worklens-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - worklens-net
